<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory: Bundesländer und Landeshauptstädte</title>
<style>
:root{--bg:#f4f1ea;--ink:#2b2b2b;--card-back:#2f5d8a;--card-land:#fff8e1;--card-stadt:#e8f4ec;--accent:#c0392b;--bar:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2127;--ink:#eee;--card-back:#3d78ad;--card-land:#4a4430;--card-stadt:#2f4a3a;--bar:#2a2f36}}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;text-align:center;padding:12px}
h1{font-size:1.4rem;margin:8px 0}
.info{display:flex;gap:12px;justify-content:center;margin:8px 0 12px;flex-wrap:wrap}
.info div{background:var(--bar);border-radius:8px;padding:6px 14px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:1100px;margin:0 auto}
@media (max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;aspect-ratio:3/4;cursor:pointer;perspective:700px}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;transition:transform .5s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px;box-sizing:border-box;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.back{background:var(--card-back);color:#fff;font-size:2.4rem;font-weight:700}
.front{transform:rotateY(180deg)}
.front.land{background:var(--card-land)}
.front.stadt{background:var(--card-stadt)}
.card.flipped .back{transform:rotateY(-180deg)}
.card.flipped .front,.card.matched .front{transform:rotateY(0)}
.card.matched .back{transform:rotateY(-180deg)}
.card.t1 .front{background:#bfe0ff!important;outline:3px solid #1f78d1}
.card.t2 .front{background:#ffd3b0!important;outline:3px solid #e07b18}
.card.t1 .name,.card.t1 .tag,.card.t2 .name,.card.t2 .tag{color:#222}
.info .tm1{border-left:10px solid #1f78d1}
.info .tm2{border-left:10px solid #e07b18}
.info .active{outline:3px solid var(--ink);font-weight:700}
.flag{max-width:80%;height:52%;object-fit:contain;display:block}
.name{font-weight:700;font-size:clamp(.62rem,2.6vw,.95rem);line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.tag{font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:2.4rem;font-weight:700;z-index:10;cursor:pointer}
.overlay.visible{display:flex}
.overlay small{font-size:1.1rem;font-weight:400;margin-top:12px}
</style>
</head>
<body>

function flag(st){return '<img class="flag" alt="Wappen '+st.l+'" src="'+WAPPEN[st.l]+'">'}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function build(){
  var cards=[];
  STATES.forEach(function(st,i){
    cards.push({id:i,t:'land',txt:st.l,tag:'Bundesland'});
    cards.push({id:i,t:'stadt',txt:st.s,tag:'Landeshauptstadt'});
  });
  shuffle(cards);
  grid.innerHTML='';
  cards.forEach(function(c){
    var el=document.createElement('div');el.className='card';el.dataset.id=c.id;el.dataset.t=c.t;
    var svg=flag(STATES[c.id]);
    el.innerHTML='<div class="face back">?</div><div class="face front '+c.t+'">'+svg+'<span class="tag">'+c.tag+'</span><span class="name">'+c.txt+'</span></div>';
    el.addEventListener('click',function(){flip(el)});
    grid.appendChild(el);
  });
}
function start(){
  clearInterval(timer);
  document.querySelectorAll('.overlay').forEach(function(o){o.classList.remove('visible')});
  left=TIME;moves=0;first=second=null;busy=false;matched=0;running=true;cur=1;score=[0,0,0];
  document.getElementById('time').textContent=left;document.getElementById('flips').textContent=0;
  ui();
  build();
  timer=setInterval(function(){
    left--;document.getElementById('time').textContent=left;
    if(left<=0){clearInterval(timer);running=false;ui();document.getElementById('overInfo').textContent=result()+' – Zum Neustart klicken';document.getElementById('over').classList.add('visible')}
  },1000);
}
function flip(el){
  if(!running||busy||el.classList.contains('flipped')||el.classList.contains('matched'))return;
  el.classList.add('flipped');
  if(!first){first=el;return}
  second=el;moves++;document.getElementById('flips').textContent=moves;busy=true;
  var ok=first.dataset.id===second.dataset.id&&first.dataset.t!==second.dataset.t;
  if(ok){
    first.classList.add('matched','t'+cur);second.classList.add('matched','t'+cur);
    first=second=null;busy=false;matched++;score[cur]++;ui();
    if(matched===STATES.length){
      clearInterval(timer);running=false;
      ui();document.getElementById('winInfo').textContent=result()+' – Zum Neustart klicken';
      setTimeout(function(){document.getElementById('win').classList.add('visible')},700);
    }
  }else{
    setTimeout(function(){first.classList.remove('flipped');second.classList.remove('flipped');first=second=null;busy=false;cur=3-cur;ui()},1000);
  }
}
document.querySelectorAll('.overlay').forEach(function(o){o.addEventListener('click',start)});
build();
</script>
</body>
</html>
